# Snellius config: the original stage inputs, the same folders the
# full-scale runs read (manage/datasets.yaml).
#   string_normalization reads the raw datasets;
#   heuristic_filtering reads the string_normalization outputs.
# full_corpus_chars: sum of datatrove's reader doc_len over the full-scale
# run (total_chars in model/results/df_train_str_norm.csv / df_train_hf.csv).
# The script warns if its own scan differs from these by more than 0.5%.

master_seed: 20261022
n_workers: 8
size_fractions: [0.001, 0.004, 0.016, 0.064]
oversample: 1.5
max_ratio: 1.10
min_docs_per_worker: 4
text_column: text
id_column: id
glob: "**/*.parquet"
output_root: /projects/0/prjs0986/energy_studies/shared/probes

inputs:
  string_normalization:
    am_stories:
      path: /projects/0/prjs0986/energy_studies/datasets/american-stories
      full_corpus_chars: 8050397857
    cc_github:
      path: /projects/0/prjs0986/energy_studies/datasets/cc_github_opencode
      full_corpus_chars: 8753497716
    cc_openalex:
      path: /projects/0/prjs0986/energy_studies/datasets/cc_openalex
      full_corpus_chars: 11710194484
    eu_parliament:
      path: /projects/0/prjs0986/energy_studies/shared/eu_parliament_32files
      full_corpus_chars: 950462068
    kb_books:
      path: /projects/0/prjs0986/energy_studies/datasets/kb-pd-books
      full_corpus_chars: 1710853338
    naturalis:
      path: /projects/0/prjs0986/energy_studies/datasets/naturalis
      full_corpus_chars: 892620679
    rechtspraak:
      path: /projects/0/prjs0986/energy_studies/datasets/rechtspraak
      full_corpus_chars: 13379993898
    tweedekamer:
